{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>LED control</title>
    <style>

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .rgb-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .color-preview {
            height: 50px;
            border-radius: 4px;
            margin-top: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LED control</h1>
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label>RGB Values (0-255)</label>
                <div class="rgb-inputs">
                    <div>
                        <label for="red">Red</label>
                        <input type="number" id="red" name="red" min="0" max="255" value="0" required>
                    </div>
                    <div>
                        <label for="green">Green</label>
                        <input type="number" id="green" name="green" min="0" max="255" value="0" required>
                    </div>
                    <div>
                        <label for="blue">Blue</label>
                        <input type="number" id="blue" name="blue" min="0" max="255" value="0" required>
                    </div>
                </div>
                <div class="color-preview" id="preview" style="background-color: rgb(0, 0, 0);"></div>
            </div>

            <div class="form-group">
                <label for="options">Select Option</label>
                <select id="options" name="option" required>
                    <option value="">-- Choose an option --</option>
                    {% for option in options %}
                        <option value="{{ option.value }}">{{ option.label }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        // Live color preview
        const inputs = document.querySelectorAll('input[type="number"]');
        const preview = document.getElementById('preview');

        function updatePreview() {
            const r = document.getElementById('red').value;
            const g = document.getElementById('green').value;
            const b = document.getElementById('blue').value;
            preview.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }

        inputs.forEach(input => {
            input.addEventListener('input', updatePreview);
        });
    </script>
</body>
</html>
{% endblock %}
